# Mosquitto configuration for Last Meeple Standing
# Supports QoS 2 persistent sessions (cleanSession=false) and browser WebSockets.

persistence true
persistence_location /mosquitto/data/

log_dest stdout

# Standard MQTT over TCP (ESP-01, ESP-32, Python game-controller, simulator)
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets (Read-only browser frontend)
listener 9001 0.0.0.0
protocol websockets

# Local ad hoc LAN — no auth required for lab kit
allow_anonymous true
